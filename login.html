<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="login.css">

</head>
<body>
    <div class="Parent-1">
        <div class="Child-1">   
             <div class="image-caption">

            <h2>Lorem Ipsum is simply</h2>

            <p>Lorem Ipsum is simply</p>

        </div>
           
        </div>
        <div class="login-form">
            <h5 class="x12">Welcome to lorem..!</h5>
        <div class="x1">

        <button class="x2" type="button">
                 Login
        </button>

         <button class="x3" type="button">
            Register
        </button>

        </div>
            <div class = "x4">
                Lorem Ipsum is simply dummy text of the printing and<br> typesetting industry.
            </div>
           <div class="x5">
    <form action="/login" method="post" class="login-fields">

        <div class="input-group">
            <label for="username">User name</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your User name"
                required
            >
        </div>

        <div class="input-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your Password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    aria-label="Show password"
                    aria-pressed="false"
                >
                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        aria-hidden="true"
                    >
                        <path
                            d="M3 3L21 21M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.8 10.8 0 0 1 12 5c5.2 0 8.8 4.1 9.5 7-.3 1.1-1.3 2.7-2.9 4.1M6.2 6.2C3.9 7.7 2.7 10 2.5 12c.7 2.9 4.3 7 9.5 7 1 0 2-.2 2.9-.5"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                </button>
            </div>
        </div>

        <div class="form-options">

            <label class="remember-me">
                <input type="checkbox" name="remember">
                <span>Remember me</span>
            </label>

            <a href="#" class="forgot-password">
                Forgot Password ?
            </a>

        </div>

    </form>
</div>
            <button type="submit" class="x11">Login</button>

           


        </div>
    </div>
    
</body>
